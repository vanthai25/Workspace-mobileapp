<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="My HungVuong">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>My HungVuong</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Syncfusion PDF Viewer uses PDF.js to render documents on Flutter Web. -->
  <script type="module" async>
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async function () {
        try {
          const registration =
              await navigator.serviceWorker.register(
            'firebase-messaging-sw.js',
            {
              scope: '/firebase-cloud-messaging-push-scope',
            }
          );

          await navigator.serviceWorker.ready;

          console.log(
            'FCM Service Worker registered:',
            registration.scope
          );
        } catch (error) {
          console.error(
            'FCM Service Worker registration failed:',
            error
          );
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
